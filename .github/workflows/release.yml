# A release: push a tag vX.Y.Z (the version in server/center/__init__.py). This tests it,
# publishes ghcr.io/sapid-labs/center:X.Y.Z and :latest for amd64 and arm64, and makes a
# GitHub release with that version's CHANGELOG section, which every Center's owner page
# offers as an update (server/center/updates.py).
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag is the version
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "VERSION = \"$v\"" server/center/__init__.py || { echo "server/center/__init__.py is not $v"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v6
      - run: cd server && uv sync && uv run pytest -q
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/sapid-labs/center:${{ env.VERSION }}
            ghcr.io/sapid-labs/center:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
      - name: Release notes from the CHANGELOG
        run: |
          awk -v v="## $VERSION" 'index($0, v) == 1 {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "Center $VERSION" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
